# سياسة الخصوصية. النصّ الإنجليزي هو المرجع، وهذه ترجمة له.
privacy.eyebrow=السياسة
privacy.title=الخصوصية
privacy.intro=ما يسجّله هذا الموقع، ولماذا، ومن يطّلع عليه. وهي قصيرة لأنّ ما يُسجَّل قليل: النصوص عامّة، وقراءتها لا تحتاج حساباً.
privacy.reading.title=القراءة والبحث
privacy.reading.body=التصفّح والبحث لا يحتاجان حساباً ولا تسجيل دخول. لا نسأل عن هويتك، ولا يُربط ما تبحث عنه بشخص.
privacy.reading.note=يحتفظ خادمنا بسجلّات وصول اعتيادية — عنوان مصدر الطلب، والصفحة المطلوبة، والوقت، ومعرّف المتصفّح. تُستخدم لإبقاء الخدمة تعمل وللتحقّق من الأعطال.
privacy.accounts.title=الحسابات، إن أنشأت واحداً
privacy.accounts.body=الحساب اختياري. وهو موجود لتتمكّن من حفظ الروايات في مجموعات خاصّة بك.
privacy.accounts.note=نحفظ بريدك الإلكتروني، والاسم الظاهر الذي تختاره، وكلمة المرور — مُجزّأة (hashed)، ولا نحتفظ بها بصيغة يمكننا قراءتها. ورموز تسجيل الدخول والتحقّق من البريد وإعادة تعيين كلمة المرور تُحفظ مُجزّأة كذلك. وتُربط مجموعاتك المحفوظة ببريدك الإلكتروني. هذا كلّ ما يعنيه الحساب.
privacy.connector.title=موصل MCP
privacy.connector.body=يتيح الموصل على {0} لمساعد ذكاء اصطناعي أن يبحث في هذه النصوص نيابةً عنك. وهو للقراءة فقط ودون مصادقة.
privacy.connector.note=ليست له حسابات ولا تسجيل دخول، فهو لا يعرف هويتك. يتلقّى عبارات البحث التي يرسلها مساعدك ويجيب عنها، ولا يحتفظ بها خارج سجلّات الوصول المذكورة أعلاه. ولا يستطيع قراءة محادثتك، ولا تغيير أيّ شيء هنا.
privacy.sharing.title=من يطّلع على شيء غيرنا
privacy.sharing.body=ثلاث خدمات، لكلٍّ منها مهمّة واحدة:
privacy.sharing.analytics=مشاهدات الصفحات على الموقع، لمعرفة الأجزاء المستخدمة. ولا يُحمَّل على الموصل.
privacy.sharing.sentry=الأخطاء، ليُنتبه إلى الأعطال وتُصلَح.
privacy.sharing.resend=يرسل رسائل التحقّق وإعادة تعيين كلمة المرور، ويتلقّى عنوانك للقيام بذلك.
privacy.never.title=ما لا نفعله
privacy.never.body=لا نبيع معلوماتك ولا نؤجّرها، ولا نشاركها مع أحد خارج الخدمات الثلاث أعلاه.
privacy.never.note=لا توجد إعلانات هنا ولا متتبّعات إعلانية. ولا نبني ملفّات عن القرّاء، ولا نستخدم ما تبحث عنه أو تحفظه لتدريب نموذج.
privacy.contact.title=بياناتك، والتواصل معنا
privacy.contact.body=اطلب منّا نسخة ممّا يحتويه حسابك، أو اطلب حذفه، وسنفعل. وحذف الحساب يزيل مجموعاته معه.
privacy.contact.note=راسلنا على {0} لأيّ أمر يخصّ هذه الصفحة، بما في ذلك تصحيحها. وإن تغيّرت هذه السياسة تغيّراً جوهرياً فسنُعلن ذلك على الموقع بدل تعديلها بصمت.
privacy.footnote={0} مشروع من {1}. آخر تحديث {2}.
privacy.lastUpdated=٩ سبتمبر ٢٠٢٦

