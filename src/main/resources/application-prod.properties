
sentry.dsn=${SENTRY_DSN:}
server.compression.enabled=true
server.use-forward-headers=true
server.compression.mime-types=application/json,application/css,application/javascript,application/xml,text/html,text/xml,text/plain
spring.thymeleaf.cache=true
spring.cache.ehcache.config=classpath:ehcache.xml
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
# Mail (Resend)
rewayaat.resend-api-key=${RESEND_API_KEY:}
rewayaat.mail-from=${MAIL_FROM:no-reply@rewayaat.info}
# Quranic insights
quranic.insights.index=rewayaat_quranic_light_filtered

# Let a pod finish what it is doing before it exits.
#
# Spring's default shutdown closes the connector immediately, so a rolling deploy or an
# autoscaler scale-down cuts requests mid-flight. That is worse here than a dropped page
# load: an MCP session lives in the memory of the pod holding it, and a client that loses
# one mid-answer reports the whole response as lost rather than retrying a single call.
#
# 25s is under the 40s termination grace period in k8s/deployment.yaml, so the container
# always exits on its own terms rather than being killed partway through the wait.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
