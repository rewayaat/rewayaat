<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>502 Bad Gateway</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/materia/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/manuscript.css?v=21" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="card shadow-sm border-0 home-card">
      <div class="card-body text-center p-5">
        <div class="text-uppercase small text-muted">Error 502</div>
        <h1 class="display-6 mb-3">Bad Gateway</h1>
        <p class="text-muted mb-4">The server is having trouble reaching the upstream service.</p>
        <a class="btn btn-primary" href="/">Back to home</a>
      </div>
    </div>
  </main>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3HSRTQD7GM"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3HSRTQD7GM', { page_title: 'Error 502' });
</script>

<script>
  /*
   * These pages are static files served by the container's error dispatch, so they
   * cannot reach the message bundle the rest of the site uses. The dispatch is a
   * forward rather than a redirect, so the address bar still holds the URL that was
   * asked for - /ar/... for a reader on the Arabic site - and that is enough to know
   * which language to show. Without this an Arabic reader following a dead link got an
   * English page laid out left to right.
   */
  (function errorLocale() {
    var path = window.location.pathname || '';
    if (path !== '/ar' && path.indexOf('/ar/') !== 0) { return; }
    var html = document.documentElement;
    html.setAttribute('lang', 'ar');
    html.setAttribute('dir', 'rtl');
    var heading = document.querySelector('h1');
    if (heading) { heading.textContent = 'بوابة خاطئة'; }
    var body = document.querySelector('p.text-muted');
    if (body) { body.textContent = 'يواجه الخادم صعوبة في الوصول إلى الخدمة المصدر.'; }
    var back = document.querySelector('a.btn');
    if (back) { back.textContent = 'العودة إلى الرئيسية'; back.setAttribute('href', '/ar/'); }
    document.title = '502 ' + 'بوابة خاطئة';
  })();
</script>
</body>
</html>
