<script>
fetch('/recent_updates.json')
    .then(function(r) { return r.json(); })
    .then(function(updates) {
        var container = document.getElementById('updatesTimeline');
        updates.forEach(function(u) {
            var entry = document.createElement('div');
            entry.className = 'update-entry';
            var dateStr = new Date(u.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            var highlights = '';
            if (u.highlights && u.highlights.length) {
                highlights = '<ul class="update-entry__highlights">' +
                    u.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('') +
                    '</ul>';
            }
            var video = '';
            if (u.video) {
                // muted is not politeness, it is the only way this plays at all: browsers
                // refuse to autoplay a video with sound, and refuse silently.
                var src = u.video + (u.video.indexOf('?') === -1 ? '?' : '&') +
                    'autoplay=1&muted=1&hideEmbedTopBar=true';
                video =
                    '<div class="update-entry__video" style="aspect-ratio: ' +
                    (u.videoAspect || '16 / 9') + '">' +
                    '<iframe src="' + src + '" title="' +
                    (u.videoTitle || u.title) + '" frameborder="0" loading="lazy"' +
                    ' allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' +
                    '</div>';
            }
            entry.innerHTML =
                '<div class="update-entry__dot"></div>' +
                '<div class="update-entry__date">' + dateStr + '</div>' +
                '<div class="update-entry__title">' + u.title + '</div>' +
                '<div class="update-entry__summary">' + u.summary + '</div>' +
                highlights +
                video;
            container.appendChild(entry);
            if (u.video) {
                loopWhileIgnored(entry.querySelector('.update-entry__video iframe'), src,
                    u.videoSeconds);
            }
        });
    });

/*
 * Restarts the demo when it finishes, until somebody actually watches it.
 *
 * Loom has no loop parameter - autoplay, hideEmbedTopBar and a start time are the whole
 * vocabulary - and the player is cross-origin, so its ended event is not ours to read.
 * Remounting the iframe is what is left. That is a blunt instrument, so it is aimed
 * carefully:
 *
 *   - only while the video is on screen, so a page left open on another section is not
 *     silently restarting something nobody can see;
 *   - only while the tab is visible, for the same reason;
 *   - and never again once the reader has clicked into the player. Focus moving into the
 *     iframe is the one interaction a parent page can still observe cross-origin, and
 *     someone who has pressed pause or scrubbed back does not want the thing reloading
 *     underneath them.
 *
 * The interval is the video's length, carried on the entry, plus a second of slack - there
 * is no way to ask the player how far along it is.
 */
function loopWhileIgnored(frame, src, seconds) {
    if (!frame) {
        return;
    }
    // Its own length plus a second of slack. There is no way to ask the player how far
    // along it is, so the entry carries the duration and this trusts it; without one,
    // a minute is long enough not to cut anything short.
    var LENGTH_MS = ((seconds || 60) + 1) * 1000;
    var onScreen = false;
    var watched = false;

    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            onScreen = entries[0].isIntersecting;
        }, { threshold: 0.4 }).observe(frame);
    } else {
        onScreen = true;
    }

    window.addEventListener('blur', function () {
        if (document.activeElement === frame) {
            watched = true;
        }
    });

    setInterval(function () {
        if (watched || !onScreen || document.hidden) {
            return;
        }
        frame.src = src;
    }, LENGTH_MS);
}
</script>
