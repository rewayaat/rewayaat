        .why__points strong { color: #0b1728; }
        .why__source { font-size: 0.78rem; color: #6a7a8a; margin: 0.55rem 0 0; font-style: italic; }
        .update-entry__guides { margin-top: 1.1rem; }
        /* Clear the sticky nav when arriving on #connector or one of its guides. */
        .update-entry, .guide { scroll-margin-top: 5rem; }
        .connector-url { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding: 0.65rem 0.8rem; border: 1px solid rgba(26,58,107,0.16); border-radius: 10px; background: #fff; }

        .connector-url code { flex: 1 1 14rem; font-size: 0.88rem; color: #0b1728; word-break: break-all; }

        .connector-url__copy:hover { background: #eaf0fa; }

<script>
fetch('/recent_updates.json')
    .then(function(r) { return r.json(); })
    .then(function(updates) {
        var container = document.getElementById('updatesTimeline');
        updates.forEach(function(u) {
            var entry = document.createElement('div');
            entry.className = 'update-entry';
            if (u.id) {
                entry.id = u.id;
            }
            var dateStr = new Date(u.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            var highlights = '';
            if (u.highlights && u.highlights.length) {
                highlights = '<ul class="update-entry__highlights">' +
                    u.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('') +
                    '</ul>';
            }
            var video = '';
            if (u.video) {
                // muted is not politeness, it is the only way this plays at all: browsers
                // refuse to autoplay a video with sound, and refuse silently.
                var src = u.video + (u.video.indexOf('?') === -1 ? '?' : '&') +
                    'autoplay=1&muted=1&hideEmbedTopBar=true';
                video =
                    '<div class="update-entry__video" style="aspect-ratio: ' +
                    (u.videoAspect || '16 / 9') + '">' +
                    '<iframe src="' + src + '" title="' +
                    (u.videoTitle || u.title) + '" frameborder="0" loading="lazy"' +
                    ' allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' +
                    '</div>';
            }
            entry.innerHTML =
                '<div class="update-entry__dot"></div>' +
                '<div class="update-entry__date">' + dateStr + '</div>' +
                '<div class="update-entry__title">' + u.title + '</div>' +
                '<div class="update-entry__summary">' + u.summary + '</div>' +
                ctaHtml(u) +
                whyHtml(u) +
                highlights +
                guidesHtml(u) +
                video;
            container.appendChild(entry);
            entry.querySelectorAll('.guide__video').forEach(playWhileVisible);
            if (u.video) {
                loopWhileIgnored(entry.querySelector('.update-entry__video iframe'), src,
                    u.videoSeconds);
            }
        });
        // The timeline is built after load, so by the time an entry exists the browser has
        // already given up on the #fragment that pointed at it. Finish the job it started.
        if (location.hash) {
            var target = document.getElementById(location.hash.slice(1));
            if (target) {
                target.scrollIntoView();
            }
        }
    });

/*
 * One button per setup guide, straight under the summary: someone who has already decided
 * should not have to scroll past the argument to reach the instructions. Built from the
 * guides themselves, so a third client is a JSON edit, not a markup change.
 */
function ctaHtml(u) {
    var linked = (u.guides || []).filter(function (g) { return g.id; });
    if (!linked.length) {
        return '';
    }
    return '<div class="update-entry__cta">' + linked.map(function (g) {
        return '<a href="#' + g.id + '"><i class="fa fa-plug" aria-hidden="true"></i>' +
            g.name + '</a>';
    }).join('') + '</div>';
}

/*
 * The case for what an entry ships, made with measurements rather than adjectives: a
 * comparison image and the points behind it. Each point should be something that was
 * checked against the corpus, and the source line says when it was measured - a claim
 * about what an assistant does on its own goes stale as the assistants change.
 */
function whyHtml(u) {
    var w = u.why;
    if (!w || !w.points || !w.points.length) {
        return '';
    }
    return '<div class="update-entry__why">' +
        (w.title ? '<h2 class="why__title">' + w.title + '</h2>' : '') +
        (w.image
            ? '<img class="why__image" src="' + w.image + '" alt="' + (w.imageAlt || '') + '"' +
              (w.imageAspect ? ' style="aspect-ratio: ' + w.imageAspect + '"' : '') +
              ' loading="lazy">'
            : '') +
        '<ul class="why__points">' +
        w.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') +
        '</ul>' +
        (w.source ? '<p class="why__source">' + w.source + '</p>' : '') +
        '</div>';
}

/*
 * Setup guides, for an entry that ships something readers install somewhere else - the
 * connector, today. Written steps come first and the walkthrough second: the steps are what
 * someone follows, and the loop is there to show where each control actually is.
 */
function guidesHtml(u) {
    if (!u.guides || !u.guides.length) {
        return '';
    }
    var url = u.connectorUrl
        ? '<div class="connector-url"><span class="connector-url__label">Connector URL</span>' +
          '<code>' + u.connectorUrl + '</code>' +
          '<button type="button" class="connector-url__copy" data-copy="' + u.connectorUrl +
          '">Copy</button></div>'
        : '';
    return '<div class="update-entry__guides">' + url + u.guides.map(function (g) {
        return '<section class="guide"' + (g.id ? ' id="' + g.id + '"' : '') + '>' +
            '<h2 class="guide__title">' + g.name + '</h2>' +
            '<ol class="guide__steps">' +
            g.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') +
            '</ol>' +
            (g.note ? '<p class="guide__note">' + g.note + '</p>' : '') +
            (g.video
                ? '<video class="guide__video" src="' + g.video + '"' +
                  (g.poster ? ' poster="' + g.poster + '"' : '') +
                  ' style="aspect-ratio: ' + (g.videoAspect || '16 / 9') + '"' +
                  ' muted loop playsinline preload="none"' +
                  ' aria-label="' + (g.videoTitle || g.name) + '"></video>'
                : '') +
            '</section>';
    }).join('') + '</div>';
}

/*
 * Plays a walkthrough only while it is on screen.
 *
 * These come from the CDN as plain files rather than through a player, so unlike the Loom
 * embed below they loop natively - the loop attribute does it, no remounting. What is left
 * to decide is when to spend the bandwidth: preload="none" fetches nothing until a video
 * scrolls into view, and pausing it off screen stops two loops decoding under a page nobody
 * is looking at.
 *
 * A reader who asked for reduced motion gets the poster and the controls instead, and so
 * does a browser that refuses to autoplay - iOS in Low Power Mode rejects play() silently.
 */
function playWhileVisible(video) {
    // The property, not just the attribute: autoplay policy reads the muted state, and an
    // attribute set through innerHTML is not something to stake that on.
    video.muted = true;
    var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
        video.controls = true;
        return;
    }
    if (!('IntersectionObserver' in window)) {
        video.autoplay = true;
        return;
    }
    new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) {
            video.pause();
            return;
        }
        var playing = video.play();
        if (playing && playing.catch) {
            playing.catch(function () {
                video.controls = true;
            });
        }
    }, { threshold: 0.4 }).observe(video);
}

document.addEventListener('click', function (e) {
    var button = e.target.closest && e.target.closest('.connector-url__copy');
    // Without the clipboard API (an insecure origin, an old browser) the URL is still on
    // screen to select by hand, which is all the button saves anyone.
    if (!button || !navigator.clipboard) {
        return;
    }
    navigator.clipboard.writeText(button.getAttribute('data-copy')).then(function () {
        button.textContent = 'Copied';
        setTimeout(function () {
            button.textContent = 'Copy';
        }, 1600);
    });
});

/*
 * Restarts the demo when it finishes, until somebody actually watches it.
 *
 * Loom has no loop parameter - autoplay, hideEmbedTopBar and a start time are the whole
 * vocabulary - and the player is cross-origin, so its ended event is not ours to read.
 * Remounting the iframe is what is left. That is a blunt instrument, so it is aimed
 * carefully:
 *
 *   - only while the video is on screen, so a page left open on another section is not
 *     silently restarting something nobody can see;
 *   - only while the tab is visible, for the same reason;
 *   - and never again once the reader has clicked into the player. Focus moving into the
 *     iframe is the one interaction a parent page can still observe cross-origin, and
 *     someone who has pressed pause or scrubbed back does not want the thing reloading
 *     underneath them.
 *
 * The interval is the video's length, carried on the entry, plus a second of slack - there
 * is no way to ask the player how far along it is.
 */
function loopWhileIgnored(frame, src, seconds) {
    if (!frame) {
        return;
    }
    // Its own length plus a second of slack. There is no way to ask the player how far
    // along it is, so the entry carries the duration and this trusts it; without one,
    // a minute is long enough not to cut anything short.
    var LENGTH_MS = ((seconds || 60) + 1) * 1000;
    var onScreen = false;
    var watched = false;

    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            onScreen = entries[0].isIntersecting;
        }, { threshold: 0.4 }).observe(frame);
    } else {
        onScreen = true;
    }

    window.addEventListener('blur', function () {
        if (document.activeElement === frame) {
            watched = true;
        }
    });

    setInterval(function () {
        if (watched || !onScreen || document.hidden) {
            return;
        }
        frame.src = src;
    }, LENGTH_MS);
}
</script>
