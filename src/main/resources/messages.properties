# The privacy policy. A compliance document: the Arabic is a translation of the English
# and the English remains the authoritative text.
privacy.eyebrow=Policy
privacy.title=Privacy
privacy.intro=What this site records, why, and who else sees it. It is short because there is not much: the corpus is public, and reading it needs no account.
privacy.reading.title=Reading and searching
privacy.reading.body=Browsing and searching require no account and no sign-in. We do not ask who you are, and nothing you search for is tied to a person.
privacy.reading.note=Our web server keeps ordinary access logs — the address the request came from, the page asked for, the time, and the browser''s user-agent string. They are used to keep the service running and to investigate faults.
privacy.accounts.title=Accounts, if you make one
privacy.accounts.body=An account is optional. It exists so that you can save narrations into collections of your own.
privacy.accounts.note=We store your email address, the display name you choose, and your password — hashed, never in a form we can read. Sign-in, email verification and password reset tokens are stored hashed too. Your saved collections are held against your email address. That is all an account is.
privacy.connector.title=The MCP connector
privacy.connector.body=The connector at {0} lets an AI assistant search this corpus on your behalf. It is read-only and unauthenticated.
privacy.connector.note=It has no accounts and no sign-in, so it never learns who you are. It receives the search terms your assistant sends, answers them, and keeps no record of them beyond the access logs above. It cannot read your conversation, and it cannot change anything here.
privacy.sharing.title=Who else sees anything
privacy.sharing.body=Three services, each for one job:
privacy.sharing.analytics=page views on the website, to see which parts are used. Not loaded on the connector.
privacy.sharing.sentry=errors, so faults are noticed and fixed.
privacy.sharing.resend=sends verification and password-reset email, and receives your address in order to do so.
privacy.never.title=What we do not do
privacy.never.body=We do not sell or rent your information, and we do not share it with anyone beyond the three services above.
privacy.never.note=There is no advertising here and no advertising trackers. We do not build profiles of readers, and we do not use anything you search for or save to train a model.
privacy.contact.title=Your data, and reaching us
privacy.contact.body=Ask us for a copy of what your account holds, or ask us to delete it, and we will. Deleting an account removes its collections with it.
privacy.contact.note=Write to {0} for anything on this page, including a correction to it. If this policy changes materially we will say so on the site rather than quietly amend it.
privacy.footnote={0} is a project of the {1}. Last updated {2}.
privacy.lastUpdated=9 September 2026

