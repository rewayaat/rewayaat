# UI strings for the server-rendered pages.
#
# Only the pages that exist in Arabic are covered: the home page and the book hub
# tree. The search application's chrome is not here - it is built in the browser,
# and invariant 8 means anything a crawler must read is rendered by the server.
#
# Spring Boot reads these as UTF-8, so the Arabic file holds Arabic rather than
# escapes.

