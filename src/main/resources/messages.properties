# The search-tips page. The code examples are in the template, not here: they are the
# query language rather than prose, and a field filter is keyed on the English field
# name and the English value in both languages.
seo.tips.title=Search Tips — The Hadith Database
seo.tips.description=How to search 50,000+ Shia narrations: exact phrases, field filters, precise and flexible matching, topic tags, and searching in Arabic or English.
tips.eyebrow=Guide
tips.title=Search Tips
tips.crumb=Search Tips
tips.intro=The search bar takes plain words, but it also understands phrases, field filters and two matching modes. A few of these make the difference between finding one narration and finding the chapter it sits in.
tips.phrase.title=Exact phrases
tips.phrase.body=Wrap words in double quotes to match them together, in order.
tips.phrase.note=Without quotes the words are matched separately, and a narration containing only one of them can still rank.
tips.field.title=Filter by field
tips.field.body=Narrow to part of the corpus with {0}. The quotes are required.
tips.field.fields=Available fields:
tips.field.english=Field names and their values are matched against the English metadata, so a filter is written in English on both sites. The narration it finds is shown in the language you are reading.
tips.combine.title=Combine the two
tips.combine.body=A field filter and search terms together search only inside that scope.
tips.combine.note=A filter on its own, with no search terms, is a request to browse: it opens the book, volume, part or chapter page instead of returning results.
tips.language.title=Arabic and English
tips.language.body=Search in either language, and type it however is easiest.
tips.language.same=Each pair above returns the same results.
tips.language.note=Vowel marks are ignored, so a bare Arabic word finds the fully vowelled text stored here. Transliteration is folded the same way: {0} finds {1}. English plurals are matched with their singular, so {2} finds narrations that say {3}.
tips.mode.title=Precise or flexible
tips.mode.body=The dropdown beside the search button chooses how strictly your words are read.
tips.mode.note={0} (the default) forgives a single mistyped letter and does not require every word, which is what you want when you are unsure of a spelling. {1} requires every word exactly as typed, which is how you check whether a particular wording occurs at all.
tips.tags.title=Topic tags
tips.tags.body=Results carry tag pills, and the bar above them lists the tags present in the current results with a count against each.
tips.tags.note=Clicking one filters what you already have rather than starting a new search, which is the quickest way to cut a broad query down to a subject.
tips.footnote=Still stuck? {0} instead — every collection, volume, part and chapter has a page of its own.
tips.footnote.browse=Browse by book


