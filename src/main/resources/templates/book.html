<!doctype html>
<html th:lang="${htmlLang} ?: 'en'" th:dir="${htmlDir} ?: 'ltr'" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: sitehead}"></head>
<body>
<nav th:replace="~{fragments/site :: sitenav}"></nav>

<main class="container py-3" th:style="${shelfBook != null} ? |--leather:${shelfBook.leather}|">
    <nav th:replace="~{fragments/site :: crumbtrail}"></nav>

    <!-- Split only when there is something to put in the second column; volume, part and
         chapter heroes keep the centred layout, and a book with no introduction would
         otherwise show an empty half. -->
    <header class="hub-hero" th:classappend="${bookSummary != null} ? 'hub-hero--split' : ''">
      <div class="hub-hero__identity">
        <div class="hub-hero__eyebrow" th:text="#{book.collection}">Collection</div>
        <h1 class="hub-hero__title" th:text="${bookTitle} ?: ${book.name}">Book name</h1>
        <div class="hub-hero__stats">
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(book.count, 0, 'COMMA')}">1,000</span>
                <span th:text="#{books.stat.narrations}">narrations</span>
            </span>
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(#lists.size(book.chapters), 0, 'COMMA')}">100</span>
                <span th:text="#{books.card.chapters}">chapters</span>
            </span>
            <a class="hub-stat" th:if="${!#lists.isEmpty(volumes)}" href="#volumes">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(#lists.size(volumes), 0)}">8</span>
                <span th:text="#{book.volumes}">volumes</span>
            </a>
        </div>
      </div>

      <!-- What the collection is, next to what it is called. A page that opens straight
           into a grid of "Volume 1..8" assumes the reader already knows the book; most
           people arriving from a search do not. -->
      <div class="hub-hero__intro" th:if="${bookSummary != null}">
        <p class="hub-hero__intro-text" th:text="${bookSummary}">An introduction.</p>
      </div>
    </header>

    <div th:replace="~{fragments/site :: ornament}"></div>

    <!-- Books with volumes list those; the chapters live one level down so that no
         single page carries thousands of links. Flat books list chapters directly. -->
    <section class="hub-group" id="volumes" th:if="${!#lists.isEmpty(volumes)}">
        <h2 class="hub-group__label" th:text="#{book.volumes}">Volumes</h2>
        <div class="hub-grid">
            <a class="hub-card hub-card--book" th:each="volume : ${volumes}" th:href="${arPrefix} + ${volume.url}">
                <span th:replace="~{fragments/bookshelf :: cardbook(${volume.chapterCount}, ${volume.number})}"></span>
                <span class="hub-card__text">
                    <span class="hub-card__title" th:text="${volume.label}">Volume 1</span>
                    <span class="hub-card__meta">
                        <span><strong th:text="${#numbers.formatInteger(volume.chapterCount, 0, 'COMMA')}">100</strong> <span th:text="#{books.card.chapters}">chapters</span></span>
                    </span>
                </span>
            </a>
        </div>
    </section>

    <section class="hub-group" th:if="${!#lists.isEmpty(parts)}">
        <h2 class="hub-group__label" th:text="#{book.parts}">Parts</h2>
        <div class="hub-grid">
            <a class="hub-card hub-card--book" th:each="part : ${parts}" th:href="${arPrefix} + ${part.url}">
                <span th:replace="~{fragments/bookshelf :: cardbook(${part.chapterCount}, null)}"></span>
                <span class="hub-card__text">
                    <span class="hub-card__title" th:text="${isArabic} ? (${part.titleAr} ?: ${part.title}) : ${part.title}">Part 1</span>
                    <span class="hub-card__meta">
                        <span><strong th:text="${#numbers.formatInteger(part.chapterCount, 0, 'COMMA')}">100</strong> <span th:text="#{books.card.chapters}">chapters</span></span>
                    </span>
                </span>
            </a>
        </div>
    </section>

    <!-- A long book with neither volumes nor parts is divided by initial letter. The
         Arabic titles do not file under the Latin letter, so an Arabic card names the
         span of chapters it opens instead. -->
    <section class="hub-group" id="letters" th:if="${!#lists.isEmpty(letters)}">
        <h2 class="hub-group__label" th:text="#{book.letters}">Chapters A–Z</h2>
        <div class="hub-grid">
            <a class="hub-card hub-card--book" th:each="group : ${letters}" th:href="${arPrefix} + ${group.url}">
                <span th:replace="~{fragments/bookshelf :: cardbook(${group.chapterCount}, null)}"></span>
                <span class="hub-card__text">
                    <span class="hub-card__title"
                          th:text="${isArabic} ? ((${group.first.titleAr} ?: ${group.first.title}) + ' – ' + (${group.last.titleAr} ?: ${group.last.title})) : ${group.label}">A</span>
                    <span class="hub-card__meta">
                        <span th:unless="${isArabic}" th:text="${group.first.title} + ' – ' + ${group.last.title}">Abandoning – Avarice</span>
                        <span><strong th:text="${#numbers.formatInteger(group.chapterCount, 0, 'COMMA')}">37</strong> <span th:text="#{books.card.chapters}">chapters</span></span>
                    </span>
                </span>
            </a>
        </div>
    </section>

    <section class="hub-group" th:if="${!#lists.isEmpty(chapters)}">
        <h2 class="hub-group__label" th:text="#{book.chapters}">Chapters</h2>
        <!-- Two destinations per row on purpose. The title goes to the chapter's own
             page, which is the crawlable, rankable URL and where a search engine sends
             people; the icon jumps straight into reading mode for someone already here
             and browsing to read. A single link could not serve both. -->
        <ul class="hub-chapters">
            <li class="hub-chapter-row" th:each="chapter, it : ${chapters}">
                <a class="hub-chapter" th:href="${arPrefix} + ${chapter.url}">
                    <span class="hub-chapter__index"
                          th:text="${#numbers.formatInteger(it.count, 0)}">1</span>
                    <span class="hub-chapter__title" th:text="${isArabic} ? (${chapter.titleAr} ?: ${chapter.title}) : ${chapter.title}">Chapter title</span>
                    <!-- Labelled, not a bare number: the ordinal on the left is also a
                         bare number, and across two or three columns the two were
                         indistinguishable. -->
                    <span class="hub-chapter__count">
                        <span th:text="${#numbers.formatInteger(chapter.count, 0)}">12</span>
                        <span class="hub-chapter__count-unit"
                              th:text="#{common.hadith}">hadith</span>
                    </span>
                </a>
            </li>
        </ul>
    </section>

    <section class="hub-group" th:if="${blurb != null}">
        <h2 class="hub-group__label" th:text="#{book.about}">About this collection</h2>
        <div class="hub-blurb">
            <div class="hub-blurb__body" th:utext="${blurb}"></div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/site :: sitefooter}"></footer>
<th:block th:replace="~{fragments/site :: analytics}"></th:block>
</body>
</html>
