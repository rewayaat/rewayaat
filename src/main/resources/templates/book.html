<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: sitehead}"></head>
<body>
<nav th:replace="~{fragments/site :: sitenav}"></nav>

<main class="container py-3">
    <nav th:replace="~{fragments/site :: crumbtrail}"></nav>

    <header class="hub-hero">
        <div class="hub-hero__eyebrow">Collection</div>
        <h1 class="hub-hero__title" th:text="${book.name}">Book name</h1>
        <div class="hub-hero__stats">
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(book.count, 0, 'COMMA')}">1,000</span>
                narrations
            </span>
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(#lists.size(book.chapters), 0, 'COMMA')}">100</span>
                chapters
            </span>
            <span class="hub-stat" th:if="${!#lists.isEmpty(volumes)}">
                <span class="hub-stat__value" th:text="${#lists.size(volumes)}">8</span>
                volumes
            </span>
        </div>
    </header>

    <div th:replace="~{fragments/site :: ornament}"></div>

    <!-- Books with volumes list those; the chapters live one level down so that no
         single page carries thousands of links. Flat books list chapters directly. -->
    <section class="hub-group" th:if="${!#lists.isEmpty(volumes)}">
        <h2 class="hub-group__label">Volumes</h2>
        <div class="hub-grid">
            <a class="hub-card" th:each="volume : ${volumes}" th:href="${volume.url}">
                <div class="hub-card__title" th:text="${volume.label}">Volume 1</div>
                <div class="hub-card__meta">
                    <span><strong th:text="${#numbers.formatInteger(volume.chapterCount, 0, 'COMMA')}">100</strong> chapters</span>
                </div>
            </a>
        </div>
    </section>

    <section class="hub-group" th:if="${!#lists.isEmpty(chapters)}">
        <h2 class="hub-group__label">Chapters</h2>
        <!-- Two destinations per row on purpose. The title goes to the chapter's own
             page, which is the crawlable, rankable URL and where a search engine sends
             people; the icon jumps straight into reading mode for someone already here
             and browsing to read. A single link could not serve both. -->
        <ul class="hub-chapters">
            <li class="hub-chapter-row" th:each="chapter, it : ${chapters}">
                <a class="hub-chapter" th:href="${chapter.url}">
                    <span class="hub-chapter__index" th:text="${it.count}">1</span>
                    <span class="hub-chapter__title" th:text="${chapter.title}">Chapter title</span>
                    <span class="hub-chapter__count" th:text="${chapter.count}">12</span>
                </a>
                <a class="hub-chapter-read" th:href="${chapter.readingUrl}"
                   th:title="'Read ' + ${chapter.title}"
                   th:aria-label="'Read ' + ${chapter.title} + ' in reading mode'">
                    <i class="fa fa-book-open" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </section>

    <section class="hub-group" th:if="${blurb != null}">
        <h2 class="hub-group__label">About this collection</h2>
        <div class="hub-blurb">
            <div class="hub-blurb__body" th:utext="${blurb}"></div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/site :: sitefooter}"></footer>
<th:block th:replace="~{fragments/site :: analytics}"></th:block>
</body>
</html>
