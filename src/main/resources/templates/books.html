<!doctype html>
<html th:lang="${htmlLang} ?: 'en'" th:dir="${htmlDir} ?: 'ltr'" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: sitehead}"></head>
<body>
<nav th:replace="~{fragments/site :: sitenav}"></nav>

<main class="container py-3">
    <nav th:replace="~{fragments/site :: crumbtrail}"></nav>

    <header class="hub-hero">
        <div class="hub-hero__eyebrow" th:text="#{books.eyebrow}">The Collections</div>
        <h1 class="hub-hero__title" th:text="#{books.title}">Shia Hadith Books</h1>
        <p class="hub-hero__lede" th:text="#{books.lede}">
            The primary Shi'i hadith collections, in Arabic with English translation.
            Every narration carries its chain of transmission, and is cross-linked to
            similar narrations and to the Qur'anic verses it draws on.
        </p>
        <div class="hub-hero__stats">
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(totalNarrations, 0, 'COMMA')}">32,519</span>
                <span th:text="#{books.stat.narrations}">narrations</span>
            </span>
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(#lists.size(books), 0)}">18</span>
                <span th:text="#{books.stat.collections}">collections</span>
            </span>
        </div>
    </header>

    <div th:replace="~{fragments/site :: ornament}"></div>

    <th:block th:replace="~{fragments/bookshelf :: bookcase(0)}"></th:block>
</main>

<footer th:replace="~{fragments/site :: sitefooter}"></footer>
<th:block th:replace="~{fragments/site :: analytics}"></th:block>
</body>
</html>
