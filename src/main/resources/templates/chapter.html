<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: sitehead}"></head>
<body>
<nav th:replace="~{fragments/site :: sitenav}"></nav>

<main class="container py-3">
    <nav th:replace="~{fragments/site :: crumbtrail}"></nav>

    <header class="hub-hero">
        <div class="hub-hero__eyebrow" th:text="${chapter.bookName}">Al-Kafi</div>
        <h1 class="hub-hero__title" th:text="${chapter.title}">Chapter title</h1>
        <div class="hub-hero__stats">
            <span class="hub-stat" th:if="${!#strings.isEmpty(chapter.volume)}">
                Volume <span class="hub-stat__value" th:text="${chapter.volume}">1</span>
            </span>
            <span class="hub-stat" th:if="${!#strings.isEmpty(chapter.section)}">
                Section <span class="hub-stat__value" th:text="${chapter.section}">20</span>
            </span>
            <span class="hub-stat">
                <span class="hub-stat__value" th:text="${#numbers.formatInteger(chapter.count, 0, 'COMMA')}">12</span>
                narrations
            </span>
        </div>
    </header>

    <div th:replace="~{fragments/site :: ornament}"></div>

    <div>
        <article class="hub-narration" th:each="narration : ${narrations}">
            <span class="hub-narration__num" th:if="${!#strings.isEmpty(narration.number)}"
                  th:text="${narration.number}">1</span>
            <p class="hub-narration__text" th:text="${narration.excerpt}">Excerpt of the narration.</p>
            <a class="hub-narration__link" th:href="${narration.url}">Read the full narration &rarr;</a>
        </article>
    </div>
</main>

<footer th:replace="~{fragments/site :: sitefooter}"></footer>
<th:block th:replace="~{fragments/site :: analytics}"></th:block>
</body>
</html>
