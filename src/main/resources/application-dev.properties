server.compression.enabled=true
server.use-forward-headers=true
server.compression.mime-types=application/json,application/css,application/javascript,application/xml,text/html,text/xml,text/plain
spring.thymeleaf.cache=false
spring.cache.ehcache.config=classpath:ehcache.xml
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
spring.devtools.livereload.enabled=true
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
# Mail (Resend)
rewayaat.resend-api-key=${RESEND_API_KEY:}
rewayaat.mail-from=${MAIL_FROM:no-reply@rewayaat.info}
rewayaat.auth.expose-debug-tokens=true
similar.rerank.enabled=false
similar.retrieval.min-percent=45

# Elasticsearch configuration
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.index=${REWAYAAT_INDEX:rewayaat_updated}
quranic.insights.index=rewayaat_quranic_light_filtered
