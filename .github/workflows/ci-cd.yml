name: Java CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'src/main/docker/Dockerfile'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'src/main/docker/Dockerfile'
      - '.github/workflows/ci-cd.yml'

jobs:
  # Runs for pull requests as well as pushes, and gates the deploy below.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -q package -DskipTests -Dcheckstyle.skip=true -Dfindbugs.skip=true

      # Testcontainers starts Elasticsearch for the run, so the integration tests are
      # part of the gate rather than something only a developer's laptop ever ran. They
      # were excluded because a runner has no Elasticsearch, and that exclusion was 65
      # of the 590 tests - all of the end-to-end cover for the Arabic site: the sweep
      # that proves no Arabic page drops the reader onto the English one, the canonical
      # and hreflang checks, the sitemap pairing. A green build said nothing about any
      # of it.
      #
      # The image is pinned to the version the cluster runs; see ElasticsearchTestSupport.
      #
      # HodaAlQuranQualityCheck stays out. It scrapes hodaalquran.com to check extraction
      # quality against the live site, so it fails on the site's bad day rather than on
      # ours, and no container fixes that.
      - name: Run tests
        run: mvn -B test -Dtestcontainers.enabled=true -Dtest='!HodaAlQuranQualityCheck' -DfailIfNoSpecifiedTests=false

  # Never runs for a pull request — only a push to master publishes and deploys.
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -q package -DskipTests -Dcheckstyle.skip=true -Dfindbugs.skip=true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cp target/rewayaat-1.0.jar src/main/docker/
          docker build -f src/main/docker/Dockerfile -t rewayaat/rewayaat-v2:$GITHUB_RUN_ID -t rewayaat/rewayaat-v2:latest src/main/docker/
          docker push rewayaat/rewayaat-v2:$GITHUB_RUN_ID
          docker push rewayaat/rewayaat-v2:latest

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save k8s-c1

      - name: Sync Kubernetes secrets
        run: |
          kubectl create secret generic rewayaat-v2-mail \
            --from-literal=MAIL_FROM="${{ secrets.MAIL_FROM }}" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --namespace=rewayaat-v2 \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic rewayaat-v2-sentry \
            --from-literal=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --namespace=rewayaat-v2 \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic rewayaat-v2-ga4 \
            --from-literal=REWAYAAT_GA4_API_SECRET="${{ secrets.REWAYAAT_GA4_API_SECRET }}" \
            --namespace=rewayaat-v2 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update kustomization image tag
        run: |
          sed -i "s|newTag: .*|newTag: \"${GITHUB_RUN_ID}\"|" k8s/kustomization.yaml

      - name: Commit and push kustomization update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update rewayaat-v2 image tag to ${GITHUB_RUN_ID}"
          git push
