name: Java CI v2

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'src/main/docker/Dockerfile.v2'
      - '.github/workflows/ci-cd-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -q package

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cp target/rewayaat-1.0.jar src/main/docker/
          docker build -f src/main/docker/Dockerfile.v2 -t rewayaat/rewayaat-v2:$GITHUB_RUN_ID -t rewayaat/rewayaat-v2:latest src/main/docker/
          docker push rewayaat/rewayaat-v2:$GITHUB_RUN_ID
          docker push rewayaat/rewayaat-v2:latest

      - name: Update kustomization image tag
        run: |
          sed -i "s|newTag: .*|newTag: \"${GITHUB_RUN_ID}\"|" k8s/kustomization.yaml

      - name: Commit and push kustomization update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update rewayaat-v2 image tag to ${GITHUB_RUN_ID}"
          git push
