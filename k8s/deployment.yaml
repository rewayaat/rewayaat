apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewayaat-v2
  namespace: rewayaat-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rewayaat-v2
  template:
    metadata:
      labels:
        app: rewayaat-v2
    spec:
      # Both replicas ran on one node until now, which made replicas: 2 and the
      # minAvailable: 1 PDB decorative: a single node failure took the whole app out,
      # and a node drain had nowhere to move the second pod to.
      #
      # DoNotSchedule rather than ScheduleAnyway, because a preference is exactly what
      # failed here -- the scheduler discards it the moment the preferred node is the
      # cheaper fit, which is how both pods ended up co-located. maxSkew: 1 still allows
      # two pods per node once every node already has one, so an HPA scale to 4 across
      # fewer nodes is not blocked; it only forbids stacking while a node sits empty.
      #
      # nodeTaintsPolicy: Honor is what makes this drain-safe. The default (Ignore)
      # counts cordoned nodes as valid domains, so during a drain the evicted node still
      # looks like somewhere a pod ought to go, and the skew maths can refuse to place
      # the replacement anywhere -- the pod stays Pending and the drain stalls on the
      # PDB. Honor excludes nodes whose NoSchedule taint the pod does not tolerate,
      # which is precisely what cordon adds.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: rewayaat-v2
      # 8s preStop plus a 25s Spring drain, with room to spare so the container is never
      # killed partway through finishing a request.
      terminationGracePeriodSeconds: 40
      containers:
        - name: rewayaat-v2
          # Overridden by k8s/kustomization.yaml images.newTag during GitOps deploys.
          image: rewayaat/rewayaat-v2:v2-base
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8002
            - name: management
              containerPort: 8003
          env:
            # The image starts java with no heap flags, so the JVM took its default of a quarter
            # of the container: 512 MiB of a 2 GiB limit, with the rest unused. At about three
            # requests a second from crawlers the heap sat at 95% of that for hours on
            # 2026-09-30 and RewayaatV2HeapPressure fired all afternoon; on 2026-09-25 the same
            # pressure ended in an OutOfMemoryError. Half the container is 1 GiB of heap, which
            # with about 350 MiB outside it keeps the working set near 70% of the limit and
            # under the 85% RewayaatV2MemoryPressure warns at.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=50"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: ELASTIC_HOST
              value: "elasticsearch-v2.elastic-v2.svc.cluster.local"
            # An alias, not an index. Analyzers cannot be changed in place, so every
            # mapping change means a reindex; pointing at an alias keeps that a data
            # operation instead of one that has to be timed against a deploy.
            # See scripts/search/migrate_index.py.
            - name: REWAYAAT_INDEX
              value: "rewayaat_hadith"
            - name: APP_BASE_URL
              value: "https://rewayaat.info"
            # The Arabic release switch, and the only irreversible step in it. While
            # this is "false" the /ar tree is live and testable here but carries
            # X-Robots-Tag: noindex and is absent from every sitemap, so a bad release
            # can be reverted without leaving indexed URLs behind. Flipping it to "true"
            # is a sync rather than a build, and is the point of no return.
            # See docs/arabic-release.md.
            - name: ARABIC_INDEXABLE
              value: "false"
            # The domain-verification token from OpenAI's app submission portal, served
            # at /.well-known/openai-apps-challenge. Empty until a submission is started,
            # and the route 404s while it is - see WellKnownController. Kept here rather
            # than in the image so that issuing or rotating a token is a sync, not a build.
            - name: OPENAI_APPS_CHALLENGE
              value: ""
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: rewayaat-v2-mail
                  key: MAIL_FROM
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rewayaat-v2-mail
                  key: RESEND_API_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: rewayaat-v2-sentry
                  key: SENTRY_DSN
          # Stop taking new work before shutting down, so nothing is cut mid-request.
          #
          # Removing a pod from its Service and telling the container to stop are not
          # ordered: without this the container can begin shutting down while nginx is
          # still sending it requests. The sleep covers that gap; Spring's graceful
          # shutdown, configured in application-prod.properties, then drains what is
          # already in flight. It matters most for MCP, where a session lives in this
          # pod's memory and a client that loses one mid-answer reports the entire
          # response as lost rather than retrying one call.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8003
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              # What the pod uses with a 1 GiB heap, so the scheduler counts it. At 1Gi two of
              # these and everything else on the node were promised memory that was not there.
              memory: "1536Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
