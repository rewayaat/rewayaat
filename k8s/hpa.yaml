apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rewayaat-v2
  namespace: rewayaat-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rewayaat-v2
  minReplicas: 2
  # Pinned to 2 on 2026-09-26: no budget for extra capacity, so the HPA is deliberately
  # inert (min == max). Raise maxReplicas when there is money for it. Note that
  # deployment.yaml also hardcodes replicas: 2 and Argo selfHeal reverts any HPA
  # scale-out within minutes, so a higher max needs that fixed too.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # An MCP session lives in the memory of the pod that created it, and the SDK has no
  # shared store, so removing a pod ends every conversation it was holding - the client
  # gets 404 on its next call, mid-answer. The default scale-down window is 5 minutes,
  # which under the ordinary up-and-down of site traffic was taking pods away often
  # enough to break connector sessions while they were still being used: 16 of 62 /mcp
  # requests were session-not-found during one such window.
  #
  # The behavior block is kept for when maxReplicas is raised again: scaling up stays
  # responsive, scaling down waits half an hour of genuinely low CPU and then removes one
  # pod at a time, slower than any reasonable conversation.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 1800
      policies:
        - type: Pods
          value: 1
          periodSeconds: 600
