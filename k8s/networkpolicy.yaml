apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rewayaat-v2-management
  namespace: rewayaat-v2
spec:
  # Both the website pods and the MCP pod. A NetworkPolicy only restricts pods it
  # selects, so naming just one of them would leave the other's management port open to
  # anything in the cluster rather than protected by omission.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - rewayaat-v2
          - rewayaat-v2-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8002
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rewayaat-v2
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8003
