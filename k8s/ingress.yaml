apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewayaat-v2
  namespace: rewayaat-v2
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/limit-rpm: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - v2.rewayaat.info
        - rewayaat.info
        - hadith.academyofislam.com
      secretName: rewayaat-v2-tls
  rules:
    - host: v2.rewayaat.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rewayaat-v2
                port:
                  number: 80
    - host: rewayaat.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rewayaat-v2
                port:
                  number: 80
    - host: hadith.academyofislam.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rewayaat-v2
                port:
                  number: 80
