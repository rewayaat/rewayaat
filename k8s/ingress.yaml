    # Scrapers that send a browser's user agent from cloud address space, a request or two
    # from each address, so the 50-a-minute limit above never sees them. Tencent Cloud
    # (AS132203) ran the 2026-09-25 burst of 40 to 60 requests a second from 43.172.0.0/15 and
    # was back on 2026-09-30; Alibaba Cloud (AS45102) did the same from 47.79.0.0/16. Blocking
    # those two only moved the fleet: the surges of 2026-11-03 and 11-05 came from 1,900
    # addresses across Alibaba, Tencent, Huawei Cloud and BytePlus ranges outside them. So the
    # list is now every IPv4 prefix those providers announce, generated by
    # scripts/ops/cloud_denylist.py — rerun it rather than editing the line by hand. Nobody
    # reads the site from a cloud provider's address range: in the week to 2026-11-06 every
    # Chinese browser (UC, QQ, Huawei, Quark, HeyTap) came from outside it, as did Baidu, Kimi,
    # DeepSeek, Qwen and Bytespider. One crawler that matters does crawl from here, Huawei's
    # PetalBot, so the script cuts its range (114.119.128.0/18) back out. Answered 403 at the
    # ingress, before the application is asked.
