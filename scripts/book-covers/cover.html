<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Source+Serif+4:opsz,wght@8..60,600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .cover { position: fixed; left: 0; top: 0; width: 400px; height: 600px; direction: rtl; font-family: 'Amiri', serif; }
  .cover > svg { position: absolute; inset: 0; }
  .gilt {
    background: linear-gradient(165deg, #7d6224 0%, #e3cc8f 30%, #a2833a 55%, #d6bc7c 78%, #86692a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .8px 0 rgba(0,0,0,.55));
    text-align: center; white-space: nowrap; padding: .22em .1em;
  }
  .title-box {
    position: absolute; left: __SIDE__px; right: __SIDE__px; top: __TOP__px; height: __H__px;
    display: flex; align-items: center; justify-content: center;
  }
  .title { font-family: __FONT__; font-weight: 700; font-size: __TITLE_SIZE__px; line-height: 1.05; }
  .eng {
    position: absolute; left: 0; right: 0; top: __ENG_TOP__px; display: flex; justify-content: center;
  }
  .eng span {
    direction: ltr; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 21px;
    font-variant-caps: all-small-caps; letter-spacing: .1em; line-height: 1.3;
  }
  .credit {
    position: absolute; left: 50px; right: 50px; top: __CREDIT__px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .lead { font-size: 15px; line-height: 1.2; }
  .author { font-weight: 700; font-size: 19px; line-height: 1.55; }
  .death { font-size: 13.5px; line-height: 1.2; }
</style>
</head>
<body>
<div class="cover">
  __SVG__
  <div class="title-box"><div class="gilt title" id="title">__TITLE__</div></div>
  <div class="eng"><span class="gilt" id="eng">__ENG__</span></div>
  <div class="credit">
    <div class="gilt lead">__LEAD__</div>
    <div class="gilt author" id="author">__AUTHOR__</div>
    <div class="gilt death">__DEATH__</div>
  </div>
</div>
<script>
  // shrink text until it fits the cartouche / panel
  document.fonts.ready.then(() => {
    for (const [id, max, maxH] of [['title', __MAXW__, __H__], ['author', __AUTHW__, 999], ['eng', __ENGW__, 999]]) {
      const el = document.getElementById(id);
      let size = parseFloat(getComputedStyle(el).fontSize);
      while ((el.getBoundingClientRect().width > max || el.getBoundingClientRect().height > maxH) && size > 10) {
        el.style.fontSize = (size -= 1) + 'px';
      }
    }
  });
</script>
</body>
</html>
